<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0F2A22">
<title>The Official Friend | AI-driven creative community agency for London</title>
<meta name="description" content="Explore our campaigns, shop the store and meet our community.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,600;1,600&amp;display=swap">
<link rel="stylesheet" href="official-friend-editorial.css">
</head>
<body>
<div style="background:#0F2A22;color:#FFF4DC;font-family:system-ui,sans-serif;box-sizing:border-box;display:flex;flex-direction:column;align-items:center">
<div style="width:100%;max-width:1120px;box-sizing:border-box;padding:0 24px;display:flex;flex-direction:column;gap:clamp(24px,4vw,44px);padding-bottom:64px">
<header style="display:flex;justify-content:space-between;align-items:center;padding-top:28px;flex-wrap:wrap;gap:12px"><a class="brand" data-referral-link href="index.html" style="font-weight:700;letter-spacing:3px;font-size:14px;color:#F2C14E"><img src="lantern-logo.png" alt="">OFFICIAL FRIEND</a><details class="site-menu">
    <summary>Menu <span aria-hidden="true"></span></summary>
    <nav aria-label="Main navigation">
      <a data-referral-link aria-current="page" href="index.html">Home</a>
      <a data-referral-link href="campaigns.html">Campaigns</a>
      <a data-referral-link href="store.html">Store</a>
      <a data-referral-link href="people.html">People</a>
      <a href="solutions.html">Solutions</a>
      <a href="contact.html">Contact</a>
    </nav>
  </details></header>
<main class="landing">
  <h1>An AI-driven creative community agency for London.</h1>
  <p class="friendship">Brought to you by the power of friendship.</p>
  <nav class="landing-links" aria-label="Explore Official Friend">
    <a data-referral-link href="campaigns.html">Explore our campaigns <span aria-hidden="true">→</span></a>
    <a data-referral-link href="store.html">Check the store <span aria-hidden="true">→</span></a>
    <a data-referral-link href="people.html">Meet our people <span aria-hidden="true">→</span></a>
  </nav>
</main>
<footer style="border-top:2px solid #D42E22;padding-top:24px;color:#D9E4DC;font-size:14px"><div class="footer-brand"><img class="section-lantern" src="lantern-logo.png" alt="" width="34" height="34" loading="lazy"><span>The Official Friend &copy; 2026</span></div></footer>
</div>
</div>
<script>
  const referral = new URLSearchParams(location.search).get('ref');
  if (referral) {
    for (const link of document.querySelectorAll('[data-referral-link]')) {
      const destination = new URL(link.href);
      destination.searchParams.set('ref', referral);
      link.href = destination.href;
    }
    const badge = document.getElementById('jacket-referral');
    if (badge && referral === 'MGES-001') badge.hidden = false;
  }
  const section = location.hash.slice(1);
  const campaignSections = ['campaigns', 'campaigns-title', 'research-title', 'blue-book-title', 'jumper', 'jacket-title', 'jacket-referral'];
  const peopleSections = ['how', 'community', 'london-story', 'london-organisers', 'london-projects', 'services', 'services-title', 'approach-title'];
  if (campaignSections.includes(section)) location.replace('campaigns.html' + location.search + location.hash);
  if (peopleSections.includes(section)) location.replace('people.html' + location.search + location.hash);
</script>
</body>
</html>
